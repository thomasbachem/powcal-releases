name: Bug report
description: Something in PowCal doesn't work as it should
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PowCal version
      placeholder: e.g. 2.1.0
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. macOS 26.5 or Windows 11
